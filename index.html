<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyTrack Pro - Huiswerk & Toets Planner</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Iconen -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(16, 18, 30, 0.8);
      --input-bg: rgba(10, 12, 22, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(108, 99, 255, 0.5);
      --primary: #6c63ff;
      --primary-gradient: linear-gradient(135deg, #6c63ff 0%, #4f46e5 100%);
      --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --primary-glow: rgba(108, 99, 255, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glow Animation */
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(108, 99, 255, 0.25) 0%, rgba(0,0,0,0) 70%);
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      z-index: -1;
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translateX(-50%) scale(0.8); opacity: 0.5; }
      100% { transform: translateX(-50%) scale(1.2); opacity: 0.9; }
    }

    /* Header & Branding */
    .header {
      width: 100%;
      max-width: 550px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 26px;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(108, 99, 255, 0.5));
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .stats-badge {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .hamburger-btn {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }

    .hamburger-btn:hover {
      background: rgba(108, 99, 255, 0.2);
      border-color: var(--border-hover);
    }

    .nav-menu {
      position: absolute;
      top: 50px;
      right: 0;
      background: rgba(16, 18, 30, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 10px;
      width: 230px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
      z-index: 1000;
      animation: popup 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-menu.active { display: flex; }
    .nav-menu ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .nav-menu a {
      color: var(--text-main);
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s ease;
    }
    .nav-menu a:hover {
      background: rgba(108, 99, 255, 0.2);
      color: #818cf8;
    }

    /* Progress Tracker Card */
    .progress-card {
      width: 100%;
      max-width: 550px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
    }

    .progress-title { color: var(--text-muted); }
    .progress-percentage { color: #818cf8; }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-gradient);
      border-radius: 10px;
      transition: width 0.4s ease;
      box-shadow: 0 0 12px rgba(79, 172, 254, 0.6);
    }

    /* Modal Overlay & Pop-up */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }

    .modal-card {
      background: rgba(18, 20, 33, 0.95);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      animation: popup 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-badge { font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 12px; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
    .close-btn:hover { color: #ffffff; }

    .submit-textarea {
      width: 100%; height: 120px; padding: 14px;
      background: var(--input-bg); border: 1px solid var(--border-color);
      border-radius: 14px; color: var(--text-main); font-family: inherit; font-size: 14px;
      resize: vertical; outline: none; margin-bottom: 16px; transition: all 0.25s ease;
    }
    .submit-textarea:focus { border-color: var(--border-hover); box-shadow: 0 0 15px rgba(108, 99, 255, 0.2); }

    /* Main Container */
    .app-container {
      width: 100%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      padding: 24px;
      border-radius: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 20px rgba(108, 99, 255, 0.05);
    }

    .card-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #818cf8;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-clear-completed {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .btn-clear-completed:hover { color: var(--danger); }

    /* Form Fields */
    .form-grid { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }

    .input-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; font-weight: 700; color: #e2e8f0; text-transform: uppercase; letter-spacing: 0.5px; }

    input, select {
      width: 100%; padding: 12px 14px;
      background: var(--input-bg); color: var(--text-main);
      border: 1px solid var(--border-color); border-radius: 12px;
      font-size: 14px; font-family: inherit; outline: none;
      transition: all 0.25s ease;
    }
    input:focus, select:focus { border-color: var(--border-hover); box-shadow: 0 0 15px rgba(108, 99, 255, 0.25); }

    .date-wrapper { display: flex; gap: 8px; }
    .date-wrapper input[type="date"] { flex: 1; color-scheme: dark; }

    .btn-quick-date {
      padding: 0 14px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color); border-radius: 12px;
      color: #ffffff; font-size: 12px; font-weight: 700; cursor: pointer;
      white-space: nowrap; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px;
    }
    .btn-quick-date:hover { background: rgba(108, 99, 255, 0.2); border-color: var(--border-hover); }

    .select-wrapper { position: relative; }
    .select-wrapper::after {
      content: '\f107'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      color: #ffffff; pointer-events: none;
    }
    select { appearance: none; cursor: pointer; }

    /* Search & Filter Bar */
    .controls-bar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }

    .search-wrapper { position: relative; width: 100%; }
    .search-wrapper i {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 14px;
    }
    .search-wrapper input {
      padding-left: 38px;
      background: rgba(16, 18, 30, 0.6);
      border-radius: 12px;
    }

    .filter-bar { display: flex; gap: 8px; }
    .filter-btn {
      flex: 1; padding: 10px; background: var(--card-bg);
      border: 1px solid var(--border-color); border-radius: 12px;
      color: var(--text-muted); font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .filter-btn.active, .filter-btn:hover {
      background: rgba(108, 99, 255, 0.15); border-color: var(--border-hover); color: #818cf8;
    }

    /* Buttons */
    .btn-submit, .generate-button {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: var(--primary-gradient); color: white; font-size: 14px;
      font-weight: 700; font-family: inherit; cursor: pointer;
      box-shadow: 0 8px 20px var(--primary-glow); transition: all 0.25s ease;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-submit:hover, .generate-button:hover {
      transform: translateY(-2px); box-shadow: 0 12px 25px rgba(108, 99, 255, 0.5);
    }

    /* Task Items */
    .task-list { display: flex; flex-direction: column; gap: 10px; }

    .task-item {
      background: var(--input-bg); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 14px 16px; display: flex; align-items: center;
      justify-content: space-between; gap: 12px; transition: all 0.25s ease;
      animation: popup 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .task-item:hover { border-color: rgba(255, 255, 255, 0.15); transform: translateY(-1px); }
    .task-item.toets { border-left: 4px solid var(--warning); }
    .task-item.huiswerk { border-left: 4px solid var(--primary); }
    .task-item.completed { opacity: 0.45; border-left: 4px solid var(--text-muted); }
    .task-item.completed .task-title { text-decoration: line-through; }

    .task-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .task-tags { display: flex; align-items: center; gap: 6px; }

    .tag {
      font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px;
      text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 4px;
    }
    .tag-subject { background: rgba(255, 255, 255, 0.08); color: #e2e8f0; border: 1px solid var(--border-color); }
    .tag-type { background: rgba(108, 99, 255, 0.2); color: #818cf8; }

    .task-title { font-size: 14px; font-weight: 600; color: var(--text-main); }
    .task-right { display: flex; align-items: center; gap: 10px; }

    .badge-date {
      font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 8px;
      background: rgba(255, 255, 255, 0.05); color: var(--text-muted); white-space: nowrap;
    }
    .badge-date.urgent {
      background: rgba(239, 68, 68, 0.2); color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
      animation: pulseUrgent 2s infinite;
    }

    @keyframes pulseUrgent {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 8px 2px rgba(239, 68, 68, 0.4); }
    }

    .task-actions { display: flex; gap: 6px; }
    .action-btn {
      width: 32px; height: 32px; border-radius: 8px;
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color);
      color: #ffffff; cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 12px; transition: all 0.2s ease;
    }
    .action-btn:hover { background: rgba(255, 255, 255, 0.15); }
    .action-btn.delete:hover { background: rgba(239, 68, 68, 0.2); color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }

    .empty-state { text-align: center; color: var(--text-muted); font-size: 13px; padding: 16px; font-weight: 500; }

    /* Toast Notifications */
    #toast-container {
      position: fixed; bottom: 20px; right: 20px;
      display: flex; flex-direction: column; gap: 10px; z-index: 3000;
    }
    .toast {
      background: rgba(18, 20, 33, 0.95); border: 1px solid var(--border-color);
      backdrop-filter: blur(10px); color: #fff; padding: 12px 18px; border-radius: 12px;
      font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); animation: toastIn 0.3s ease forwards;
    }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.info { border-left: 4px solid var(--primary); }
    .toast.danger { border-left: 4px solid var(--danger); }

    @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popup { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .footer-text { text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Header -->
  <header class="header">
    <div class="brand">
      <i class="fa-solid fa-graduation-cap brand-icon"></i>
      <span class="brand-title">StudyTrack</span>
    </div>
    <div class="header-actions">
      <div class="stats-badge" id="stats">0 taken open</div>
      <button class="hamburger-btn" id="hamburger-btn" onclick="toggleMenu()" aria-label="Menu">
        <i class="fa-solid fa-bars"></i>
      </button>
      <nav class="nav-menu" id="navMenu">
        <ul>
          <li><a href="https://excuusexpert.github.io" target="_blank" onclick="toggleMenu()"><i class="fa-solid fa-wand-magic-sparkles"></i> ExcuusExpert</a></li>
          <li><a href="https://www.snapchat.com/@excuus-expert" target="_blank" onclick="toggleMenu()"><i class="fa-brands fa-snapchat"></i> Snapchat</a></li>
          <li><a href="#" onclick="toggleMenu(); openSubmitModal();"><i class="fa-solid fa-paper-plane"></i> Verbetering Insturen</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Progress Bar Card -->
  <div class="progress-card">
    <div class="progress-header">
      <span class="progress-title">Totale Voortgang</span>
      <span class="progress-percentage" id="progress-text">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- INSTUUR MODAL POP-UP -->
  <div id="submitModal" class="modal-overlay" onclick="closeSubmitModal(event)">
    <div class="modal-card submit-card">
      <div class="modal-header">
        <span class="modal-badge" style="background: rgba(108, 99, 255, 0.2); color: #a5b4fc;">💡 VERBETERING INSTUREN</span>
        <button class="close-btn" onclick="closeSubmitModalDirect()">&times;</button>
      </div>

      <form id="excuseForm" action="https://formspree.io/f/xkjngdbl" method="POST" onsubmit="handleFormSubmit(event)">
        <textarea name="smoes" class="submit-textarea" placeholder="Typ hier jouw meesterlijke verbetering..." required></textarea>
        <button type="submit" class="generate-button">
          🚀 Versturen
        </button>
      </form>
    </div>
  </div>

  <div class="app-container">

    <!-- Invoer Card -->
    <section class="card">
      <div class="card-title-bar">
        <div class="card-title">
          <i class="fa-solid fa-plus-circle"></i> Snel Taak Toevoegen
        </div>
      </div>
      <form id="task-form">
        <div class="form-grid">
          <div class="form-row">
            <div class="input-group">
              <label for="subject">Vak</label>
              <input type="text" id="subject" placeholder="bijv. Wiskunde" required />
            </div>
            <div class="input-group">
              <label for="type">Type</label>
              <div class="select-wrapper">
                <select id="type">
                  <option value="Huiswerk">Huiswerk</option>
                  <option value="Toets">Toets / PW</option>
                </select>
              </div>
            </div>
          </div>

          <div class="input-group">
            <label for="title">Omschrijving</label>
            <input type="text" id="title" placeholder="bijv. Hoofdstuk 4 leren" required />
          </div>

          <div class="input-group">
            <label for="date">Datum / Deadline</label>
            <div class="date-wrapper">
              <input type="date" id="date" required />
              <button type="button" class="btn-quick-date" id="btn-tomorrow">
                <i class="fa-solid fa-forward-fast"></i> Morgen
              </button>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-bolt"></i> Toevoegen
        </button>
      </form>
    </section>

    <!-- Search & Filter Controls -->
    <div class="controls-bar">
      <div class="search-wrapper">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Zoek op vak of titel..." />
      </div>
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">Alles</button>
        <button class="filter-btn" data-filter="Toets"><i class="fa-solid fa-pen-to-square"></i> Toetsen</button>
        <button class="filter-btn" data-filter="Huiswerk"><i class="fa-solid fa-book-open"></i> Huiswerk</button>
      </div>
    </div>

    <!-- Binnenkort Card -->
    <section class="card">
      <div class="card-title-bar">
        <div class="card-title">
          <i class="fa-solid fa-calendar-days"></i> Openstaand
        </div>
      </div>
      <div id="pending-tasks" class="task-list"></div>
    </section>

    <!-- Afgerond Card -->
    <section class="card">
      <div class="card-title-bar">
        <div class="card-title" style="color: var(--text-muted);">
          <i class="fa-solid fa-circle-check"></i> Afgerond
        </div>
        <button class="btn-clear-completed" onclick="clearCompletedTasks()">Wis afgerond</button>
      </div>
      <div id="completed-tasks" class="task-list"></div>
    </section>

    <div class="footer-text">
      StudyTrack &bull; Made by less/ExcuusExpert 
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'studytrack_excuus_v2';

    const taskForm = document.getElementById('task-form');
    const pendingTasksContainer = document.getElementById('pending-tasks');
    const completedTasksContainer = document.getElementById('completed-tasks');
    const statsElement = document.getElementById('stats');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const dateInput = document.getElementById('date');
    const btnTomorrow = document.getElementById('btn-tomorrow');
    const searchInput = document.getElementById('search-input');
    const progressFill = document.getElementById('progress-fill');
    const progressText = document.getElementById('progress-text');

    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let currentFilter = 'all';
    let searchQuery = '';

    function toggleMenu() {
      document.getElementById('navMenu').classList.toggle('active');
    }

    function openSubmitModal() {
      document.getElementById('submitModal').classList.add('active');
    }

    function closeSubmitModal(e) {
      if (e.target.id === 'submitModal') closeSubmitModalDirect();
    }

    function closeSubmitModalDirect() {
      document.getElementById('submitModal').classList.remove('active');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check' : 'fa-info-circle'}"></i> ${message}`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const form = e.target;
      try {
        const response = await fetch(form.action, {
          method: form.method,
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });
        if (response.ok) {
          showToast('Bedankt! Je inzending is verstuurd.', 'success');
          form.reset();
          closeSubmitModalDirect();
        } else {
          showToast('Er ging iets mis bij het versturen.', 'danger');
        }
      } catch (error) {
        showToast('Netwerkfout opgetreden.', 'danger');
      }
    }

    document.addEventListener('click', (e) => {
      const navMenu = document.getElementById('navMenu');
      const hamburgerBtn = document.getElementById('hamburger-btn');
      if (navMenu && hamburgerBtn && !navMenu.contains(e.target) && !hamburgerBtn.contains(e.target)) {
        navMenu.classList.remove('active');
      }
    });

    const todayStr = new Date().toISOString().split('T')[0];
    dateInput.min = todayStr;
    dateInput.value = todayStr;

    btnTomorrow.addEventListener('click', () => {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      dateInput.value = tomorrow.toISOString().split('T')[0];
    });

    taskForm.addEventListener('submit', addTask);

    filterButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        filterButtons.forEach(b => b.classList.remove('active'));
        const target = e.target.closest('.filter-btn');
        target.classList.add('active');
        currentFilter = target.dataset.filter;
        renderTasks();
      });
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderTasks();
    });

    function addTask(e) {
      e.preventDefault();
      const newTask = {
        id: Date.now().toString(),
        subject: document.getElementById('subject').value.trim(),
        title: document.getElementById('title').value.trim(),
        date: dateInput.value,
        type: document.getElementById('type').value,
        completed: false
      };

      tasks.push(newTask);
      saveAndRender();
      showToast('Taak toegevoegd!', 'success');

      document.getElementById('title').value = '';
      document.getElementById('subject').value = '';
      dateInput.value = todayStr;
    }

    function toggleTask(id) {
      tasks = tasks.map(task => task.id === id ? { ...task, completed: !task.completed } : task);
      saveAndRender();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      saveAndRender();
      showToast('Taak verwijderd.', 'danger');
    }

    function clearCompletedTasks() {
      const completedCount = tasks.filter(t => t.completed).length;
      if (completedCount === 0) return;
      tasks = tasks.filter(t => !t.completed);
      saveAndRender();
      showToast('Afgeronde taken gewist!', 'info');
    }

    function saveAndRender() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      renderTasks();
    }

    function getDaysRemaining(dateString) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const targetDate = new Date(dateString); targetDate.setHours(0, 0, 0, 0);
      return Math.ceil((targetDate - today) / (1000 * 60 * 60 * 24));
    }

    function updateProgressBar() {
      if (tasks.length === 0) {
        progressFill.style.width = '0%';
        progressText.textContent = '0%';
        return;
      }
      const completed = tasks.filter(t => t.completed).length;
      const percentage = Math.round((completed / tasks.length) * 100);
      progressFill.style.width = `${percentage}%`;
      progressText.textContent = `${percentage}%`;
    }

    function renderTasks() {
      pendingTasksContainer.innerHTML = '';
      completedTasksContainer.innerHTML = '';

      const filteredTasks = tasks.filter(task => {
        const matchesFilter = currentFilter === 'all' || task.type === currentFilter;
        const matchesSearch = task.subject.toLowerCase().includes(searchQuery) || task.title.toLowerCase().includes(searchQuery);
        return matchesFilter && matchesSearch;
      });

      filteredTasks.sort((a, b) => new Date(a.date) - new Date(b.date));

      filteredTasks.forEach(task => {
        const daysLeft = getDaysRemaining(task.date);
        let dateBadgeText = '';
        let isUrgent = false;

        if (daysLeft < 0) dateBadgeText = 'Verstreken';
        else if (daysLeft === 0) { dateBadgeText = 'Vandaag!'; isUrgent = true; }
        else if (daysLeft === 1) { dateBadgeText = 'Morgen'; isUrgent = true; }
        else dateBadgeText = `Over ${daysLeft} dg`;

        const typeIcon = task.type === 'Toets' ? 'fa-pen-to-square' : 'fa-book-open';

        const taskElement = document.createElement('div');
        taskElement.className = `task-item ${task.type.toLowerCase()} ${task.completed ? 'completed' : ''}`;
        taskElement.innerHTML = `
          <div class="task-info">
            <div class="task-tags">
              <span class="tag tag-subject">${escapeHtml(task.subject)}</span>
              <span class="tag tag-type"><i class="fa-solid ${typeIcon}"></i> ${task.type}</span>
            </div>
            <div class="task-title">${escapeHtml(task.title)}</div>
          </div>
          <div class="task-right">
            <span class="badge-date ${isUrgent && !task.completed ? 'urgent' : ''}">${dateBadgeText}</span>
            <div class="task-actions">
              <button class="action-btn" onclick="toggleTask('${task.id}')" title="Status wijzigen">
                <i class="fa-solid ${task.completed ? 'fa-rotate-left' : 'fa-check'}"></i>
              </button>
              <button class="action-btn delete" onclick="deleteTask('${task.id}')" title="Verwijderen">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        `;

        if (task.completed) completedTasksContainer.appendChild(taskElement);
        else pendingTasksContainer.appendChild(taskElement);
      });

      if (pendingTasksContainer.children.length === 0) {
        pendingTasksContainer.innerHTML = '<div class="empty-state">Geen openstaande taken!</div>';
      }
      if (completedTasksContainer.children.length === 0) {
        completedTasksContainer.innerHTML = '<div class="empty-state">Nog niets afgerond.</div>';
      }

      const totalOpen = tasks.filter(t => !t.completed).length;
      statsElement.textContent = `${totalOpen} ${totalOpen === 1 ? 'taak' : 'taken'} open`;

      updateProgressBar();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    renderTasks();
  </script>
</body>
</html>
